<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>HTML Audio and Video Lab</title>
</head>
<body>
<h1>My Media Player</h1>

  <section>
    <h2>What is the Map Method?</h2>

    <video controls width="640">
      <source
        src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
        type="video/mp4"
      >
    </video>
  </section>

  <section>
    <h2>Sailing Away</h2>

    <audio
      controls
      loop
      src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
    ></audio>
    
  </section>
<p>iframe Video</p>
  <div>
    <iframe width="420" height="345" src="https://www.youtube.com/embed/tgbNymZ7vqY">
</iframe>
  </div>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/I0_951_MPE0?si=y9IDc3rYYE1sHKIP" title="YouTube video player" allowfullscreen></iframe>
</body>
</html>
