<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Student Survey Form</h1>

<p id="description">Please fill out this short survey.</p>

<form id="survey-form">

  <label id="name-label" for="name">Name</label>
  <input
    id="name"
    type="text"
    placeholder="Enter your name"
    required
  >

  <label id="email-label" for="email">Email</label>
  <input
    id="email"
    type="email"
    placeholder="Enter your email"
    required
  >

  <label id="number-label" for="number">Age</label>
  <input
    id="number"
    type="number"
    min="10"
    max="100"
    placeholder="Enter your age"
  >

  <label for="dropdown">Favorite subject</label>
  <select id="dropdown">
    <option value="html">HTML</option>
    <option value="css">CSS</option>
  </select>

  <p>How do you prefer to learn?</p>

  <label>
    <input type="radio" name="learning" value="online">
    Online
  </label>

  <label>
    <input type="radio" name="learning" value="classroom">
    Classroom
  </label>

  <p>Which topics interest you?</p>

  <label>
    <input type="checkbox" value="html">
    HTML
  </label>

  <label>
    <input type="checkbox" value="css">
    CSS
  </label>

  <textarea placeholder="Enter additional comments" ></textarea>

  <button id="submit" type="submit">Submit</button>
  <h2>Other projects</h2>
  <a href="./Audio&video&music.html">video project</a>
</form>
  </body>
</html>
